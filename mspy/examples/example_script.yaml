# 示例YAML脚本
# 演示如何使用YAML格式定义自动化测试

# Web环境配置
web:
  url: https://example.com
  headed: true
  viewport:
    width: 1280
    height: 720

# 任务列表
tasks:
  - name: 基础页面验证
    flow:
      # 等待页面加载
      - sleep: 1000
      
      # 断言页面包含预期内容
      - aiAssert: 页面标题显示 "Example Domain"
      
      # 记录日志
      - log: "页面验证完成"
      
  - name: 链接点击测试
    flow:
      # 点击"More information"链接
      - aiTap: More information 链接
      
      # 等待页面跳转
      - sleep: 2000
      
      # 验证跳转后的页面
      - aiAssert: 页面已跳转到新网址
